<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1600" width="2400" height="1600"><defs><linearGradient id="id23" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="id24" cx="0.14" cy="0.1" r="0.5"><stop offset="0" stop-color="rgba(46,86,170,0.38)"/><stop offset="1" stop-color="rgba(46,86,170,0)"/></radialGradient></defs><rect width="2400" height="1600" fill="url(#id23)"/><rect width="2400" height="1600" fill="url(#id24)"/><defs><linearGradient id="id22" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ecf6b"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#4772fa"/></linearGradient></defs><circle cx="138" cy="335" r="9" fill="#22d3ee"/><text x="164" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#9aa2b4" text-anchor="start" letter-spacing="6">PICK FROM THE LIST</text><text x="130" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="#ffffff" text-anchor="start">Nothing pre-set.</text><text x="130" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="url(#id22)" text-anchor="start">You choose.</text><text x="130" y="770" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#aeb6c6" text-anchor="start">A fresh button does nothing until you pick.</text><text x="130" y="828" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#aeb6c6" text-anchor="start">The dropdown reads every shortcut on your</text><text x="130" y="886" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#aeb6c6" text-anchor="start">Mac, alphabetically, always current.</text><rect x="130" y="1097" width="44" height="44" rx="12.32" fill="rgba(138,92,255,0.14)" stroke="#22d3ee" stroke-width="2"/><path d="M 141 1119.88 L 149.36 1127.8 L 163.44 1110.2" fill="none" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="194" y="1130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e6e9f0" text-anchor="start">No accidental runs by default</text><rect x="130" y="1197" width="44" height="44" rx="12.32" fill="rgba(138,92,255,0.14)" stroke="#22d3ee" stroke-width="2"/><path d="M 141 1219.88 L 149.36 1227.8 L 163.44 1210.2" fill="none" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="194" y="1230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e6e9f0" text-anchor="start">A–Z, straight from macOS</text><rect x="130" y="1297" width="44" height="44" rx="12.32" fill="rgba(138,92,255,0.14)" stroke="#22d3ee" stroke-width="2"/><path d="M 141 1319.88 L 149.36 1327.8 L 163.44 1310.2" fill="none" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="194" y="1330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e6e9f0" text-anchor="start">Refresh re-reads list + icons</text><rect x="1150" y="360" width="1120" height="880" rx="26" fill="#1e1f22" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><rect x="1150" y="360" width="1120" height="70" rx="26" fill="#26272b"/><rect x="1150" y="400" width="1120" height="30" fill="#26272b"/><circle cx="1184" cy="395" r="9" fill="#ff5f57"/><circle cx="1214" cy="395" r="9" fill="#febc2e"/><circle cx="1244" cy="395" r="9" fill="#28c840"/><text x="1710" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#c9cdd6" text-anchor="middle">Apple Shortcuts</text><text x="1210" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#c9cdd6" text-anchor="start">Shortcut</text><rect x="1450" y="460" width="760" height="64" rx="10" fill="#18191b" stroke="#8A5CFF" stroke-width="2"/><text x="1474" y="503" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="start">Start Pomodoro</text><path d="M 2166 484 l 14 16 l 14 -16" fill="none" stroke="#8b93a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1450" y="544" width="760" height="464" rx="12" fill="#0f1012" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="1478" y="597" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#8b93a7" text-anchor="start">— Select a Shortcut —</text><text x="1478" y="671" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cfd4e0" text-anchor="start">Meme Maker</text><text x="1478" y="745" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cfd4e0" text-anchor="start">Play</text><rect x="1458" y="776" width="744" height="66" rx="8" fill="rgba(138,92,255,0.20)"/><text x="1478" y="819" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f0e9ff" text-anchor="start">Start Pomodoro</text><path d="M 2150 811 l 12 12 l 22 -24" fill="none" stroke="#8A5CFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="1478" y="893" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cfd4e0" text-anchor="start">Start alarm</text><text x="1478" y="967" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cfd4e0" text-anchor="start">Volume Down</text><rect x="1950" y="1038" width="260" height="62" rx="10" fill="none" stroke="#00ffe6" stroke-width="1.5"/><text x="2080" y="1079" font-family="Helvetica Neue, Helvetica, Arial, s